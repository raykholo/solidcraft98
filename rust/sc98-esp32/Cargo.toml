[package]
name = "sc98-esp32"
version.workspace = true
edition.workspace = true
license.workspace = true
build = "build.rs"

[features]
default = ["esp32c3"]
esp32c3 = ["esp-hal/esp32c3"]
esp32c6 = ["esp-hal/esp32c6"]
esp32s3 = ["esp-hal/esp32s3"]
esp32 = ["esp-hal/esp32"]

[[bin]]
name = "sc98-esp32"
path = "src/main.rs"
test = false
bench = false

[target.'cfg(target_os = "none")'.dependencies]
esp-hal = "0.23.1"
esp-alloc = "0.6"
embedded-io = "0.6"
[dependencies]
sc98-app = { path = "../sc98-app" }
sc98-core = { path = "../sc98-core" }
sc98-term = { path = "../sc98-term" }

[target.'cfg(target_os = "none")'.dependencies.nb]
version = "1"
