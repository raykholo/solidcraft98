[workspace]
members = ["sc98-core", "sc98-pixels", "sc98-desktop", "sc98-term", "sc98-term-demo", "sc98-app", "sc98-term-app", "sc98-esp32"]
default-members = ["sc98-core", "sc98-pixels", "sc98-desktop", "sc98-term", "sc98-term-demo", "sc98-app", "sc98-term-app"]
resolver = "2"

[workspace.package]
edition = "2021"
license = "MIT"
version = "0.1.0"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
