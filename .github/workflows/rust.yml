name: Embedded Edition

on:
  push:
    paths: ["rust/**", ".github/workflows/rust.yml"]
  pull_request:
    paths: ["rust/**", ".github/workflows/rust.yml"]
  workflow_dispatch:

jobs:
  rust:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: rust
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
          targets: riscv32imc-unknown-none-elf
      - run: cargo fmt --all --check
      - run: cargo test --workspace
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo build --release -p sc98-term --target riscv32imc-unknown-none-elf
      - run: cargo build --release -p sc98-term --features size-probe --example size_probe --target riscv32imc-unknown-none-elf
      - run: size -A target/riscv32imc-unknown-none-elf/release/examples/size_probe
      - run: cargo run --release -p sc98-term-demo -- --measure
      - uses: actions/upload-artifact@v7
        with:
          name: terminal-size-probe
          path: rust/target/riscv32imc-unknown-none-elf/release/examples/size_probe
