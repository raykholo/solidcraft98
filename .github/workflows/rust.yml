name: Embedded core

on:
  push:
    paths: ["rust/**", "samples/**", "freebasic/src/**", "freebasic/tests/**", "delphi/tests/**", ".github/workflows/rust.yml"]
  pull_request:
    paths: ["rust/**", "samples/**", "freebasic/src/**", "freebasic/tests/**", "delphi/tests/**", ".github/workflows/rust.yml"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rust:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: rust
    steps:
      - uses: actions/checkout@v7
      - name: Install Rust tools and RISC-V target
        run: |
          rustup toolchain install stable --profile minimal --component clippy,rustfmt --target riscv32imc-unknown-none-elf
          rustup default stable
      - name: Format
        run: cargo fmt --all --check
      - name: Check default core without std
        run: cargo check --locked -p sc98-core --no-default-features
      - name: Test editions together
        run: cargo test --locked --workspace --all-features
      - name: Clippy
        run: cargo clippy --locked --workspace --all-targets --all-features -- -D warnings
      - name: RISC-V core release and archive size
        run: |
          cargo build --locked -p sc98-core --release --no-default-features --target riscv32imc-unknown-none-elf
          bytes=$(stat -c %s target/riscv32imc-unknown-none-elf/release/libsc98_core.rlib)
          echo "sc98-core RISC-V release archive (default): $bytes bytes; includes Rust metadata." >> "$GITHUB_STEP_SUMMARY"
          cargo build --locked -p sc98-core --release --features import --target riscv32imc-unknown-none-elf
          bytes=$(stat -c %s target/riscv32imc-unknown-none-elf/release/libsc98_core.rlib)
          echo "sc98-core RISC-V release archive (import): $bytes bytes; includes Rust metadata." >> "$GITHUB_STEP_SUMMARY"
